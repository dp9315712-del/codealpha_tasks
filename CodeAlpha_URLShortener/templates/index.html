<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha URL Shortener</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #dcfce7;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        .error {
            color: red;
            margin-top: 15px;
        }

        a {
            color: #2563eb;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>URL Shortener</h1>

        <p>Convert your long URL into a short URL.</p>

        <form method="POST">

            <input
                type="text"
                name="original_url"
                placeholder="Enter your long URL"
                required
            >

            <button type="submit">
                Generate Short URL
            </button>

        </form>

        {% if short_url %}

            <div class="result">

                <h3>Your Short URL</h3>

                <a href="{{ short_url }}" target="_blank">
                    {{ short_url }}
                </a>

            </div>

        {% endif %}

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

    </div>

</body>

</html>
